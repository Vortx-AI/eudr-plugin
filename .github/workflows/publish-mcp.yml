name: Publish to MCP Registry

on:
  push:
    branches: [main]
    paths: [server.json]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: npm install -g @anthropic-ai/mcp-publisher
      - name: Publish
        run: |
          mcp-publisher login github-oidc
          mcp-publisher publish
